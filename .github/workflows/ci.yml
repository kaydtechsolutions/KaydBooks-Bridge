name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv==0.12.7
      - run: uv sync --frozen --extra dev --extra hermes --extra remote --python ${{ matrix.python-version }}
      - run: uv run --frozen --extra dev --extra hermes --extra remote pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.7
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: for script in deploy/install.sh deploy/doctor.sh deploy/auto-install.sh deploy/bootstrap.sh; do sh -n "$script"; done
      - run: uv build

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows setup and check invalid endpoints without mutation
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/windows-setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          foreach ($url in @('http://host.tail.ts.net', 'https://example.com', 'https://host.tail.ts.net/mcp', 'https://host.tail.ts.net:8443')) {
            $rejected = $false
            try { & ./deploy/windows-setup.ps1 -CheckOnly -ServerUrl $url }
            catch { $rejected = $_.Exception.Message -like 'ServerUrl must*' }
            if (-not $rejected) { throw "Unsafe endpoint accepted: $url" }
          }
      - name: Verify bundled Web Connector detection
        shell: powershell
        run: ./tests/windows_setup_checks.ps1

  linux-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install and resume on a disposable Linux runner
        run: |
          git remote set-url origin https://github.com/kaydtechsolutions/KaydBooks-Bridge.git
          sudo --preserve-env=GITHUB_ACTIONS python3 tests/installer_linux_smoke.py
      - name: Service diagnostics on failure
        if: failure()
        run: sudo journalctl -u caddy -u kaydbooks-bridge -u kaydbooks-remote-mcp -n 80 --no-pager

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.7
      - run: uv sync --frozen --extra dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/test_web_browser.py -q
        env:
          KAYDBOOKS_BROWSER_TESTS: "1"

  offline-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install uv==0.12.7
      - run: uv sync --frozen --extra dev --extra intake
      - run: npm ci --ignore-scripts
        working-directory: ocr
      - run: uv run playwright install --with-deps chromium
      - name: Qualify local corpus and source review
        run: |
          export KAYDBOOKS_OCR_NODE="$(command -v node)"
          export KAYDBOOKS_OCR_MODULES="$PWD/ocr/node_modules"
          uv run pytest tests/test_extraction.py tests/test_web_browser.py -q
        env:
          KAYDBOOKS_OCR_TESTS: "1"
          KAYDBOOKS_BROWSER_TESTS: "1"
