# Publishes to PyPI and creates the GitHub Release when a v* tag is pushed.
#
# PyPI auth: project-scoped API token stored in the PYPI_TOKEN repo secret
# (set via `gh secret set PYPI_TOKEN`). Token lives locally at
# ~/.config/pypi/tokens/qbwc-kit.token.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: twine upload -u __token__ -p "$PYPI_TOKEN" dist/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true