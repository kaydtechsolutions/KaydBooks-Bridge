name: Bug report
description: Report a reproducible KaydBooks Bridge defect without private accounting data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, company files, customer or supplier data, raw qbXML, or private logs.
  - type: input
    id: version
    attributes:
      label: Bridge version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Linux service
        - Windows QuickBooks or QBWC
        - Remote MCP
        - Hermes or WhatsApp
        - Composio
        - Simulation or tests
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic or redacted values and include the exact sequence of actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private company information.
          required: true
