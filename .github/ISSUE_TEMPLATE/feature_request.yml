name: Feature request
description: Propose a bounded change to an existing KaydBooks workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the business outcome with synthetic examples. Do not attach private accounting data.
  - type: textarea
    id: outcome
    attributes:
      label: Requested outcome
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Company, approval, duplicate and recovery controls
      description: Explain which company scope, users, approvals and failure behavior are required.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: List the observable results that would prove the feature works safely.
    validations:
      required: true
