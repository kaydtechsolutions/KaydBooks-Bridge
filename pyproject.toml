[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaydbooks-bridge"
version = "0.1.0.dev1"
description = "Company-scoped QuickBooks Desktop automation foundation with a simulation-only job service."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KaydTech Solutions" }]
keywords = ["quickbooks", "qbxml", "web-connector", "qbwc", "soap", "accounting", "erp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.100"]
dev = ["pytest>=7", "fastapi>=0.100", "httpx>=0.24", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/kaydtechsolutions/KaydBooks-Bridge"
Issues = "https://github.com/kaydtechsolutions/KaydBooks-Bridge/issues"

[project.scripts]
kaydbooks-bridge = "kaydbooks_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]
# Code blocks in the README are hand-aligned for reading; recent ruff versions
# format markdown too, and that alignment is not worth a red CI badge.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
